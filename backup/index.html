<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armandita Coffee &amp; Friends — En Construcción</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a110a;
      overflow: hidden;
      font-family: 'Lato', sans-serif;
      color: #f5ebe0;
    }

    /* ===== STEAM PARTICLES ===== */
    .steam-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .steam {
      position: absolute;
      bottom: 0;
      width: 8px;
      height: 8px;
      background: radial-gradient(circle, rgba(210,180,140,0.25), transparent);
      border-radius: 50%;
      animation: rise linear infinite;
      filter: blur(3px);
    }

    @keyframes rise {
      0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0; }
      10% { opacity: 0.6; }
      50% { opacity: 0.3; }
      100% { transform: translateY(-100vh) scale(3) rotate(360deg); opacity: 0; }
    }

    /* ===== COFFEE CUP ANIMATION ===== */
    .cup-scene {
      position: relative;
      z-index: 1;
      margin-bottom: 40px;
    }

    .cup-wrapper {
      position: relative;
      width: 160px;
      height: 180px;
    }

    /* Saucer */
    .saucer {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 24px;
      background: linear-gradient(180deg, #d4a574, #b8845a);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .saucer::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 10%;
      width: 80%;
      height: 40%;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
    }

    /* Cup body */
    .cup {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 100px;
      background: linear-gradient(135deg, #f5f0eb, #e8ddd4);
      border-radius: 0 0 30px 30px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .cup::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(180deg, #e0d5ca, #f5f0eb);
      border-radius: 4px 4px 0 0;
    }

    /* Coffee inside the cup */
    .coffee {
      position: absolute;
      top: 12px;
      left: 6px;
      right: 6px;
      bottom: 8px;
      background: linear-gradient(180deg, #3c1e0a, #5a2d0c, #6b3410);
      border-radius: 0 0 24px 24px;
      overflow: hidden;
    }

    .coffee::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 30%;
      background: radial-gradient(ellipse at 30% 50%, rgba(180,130,80,0.4), transparent 60%);
      animation: coffeeShimmer 4s ease-in-out infinite;
    }

    @keyframes coffeeShimmer {
      0%, 100% { opacity: 0.5; transform: translateX(-10px); }
      50% { opacity: 1; transform: translateX(10px); }
    }

    /* Cup handle */
    .handle {
      position: absolute;
      right: -28px;
      top: 50%;
      transform: translateY(-60%);
      width: 36px;
      height: 50px;
      border: 8px solid #f5f0eb;
      border-left: none;
      border-radius: 0 30px 30px 0;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
    }

    /* Cup steam */
    .cup-steam {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }

    .cup-steam span {
      display: block;
      width: 8px;
      height: 40px;
      background: linear-gradient(to top, rgba(200,180,160,0.4), transparent);
      border-radius: 50%;
      filter: blur(4px);
      animation: steam 2.5s ease-in-out infinite;
    }

    .cup-steam span:nth-child(1) { animation-delay: 0s; height: 35px; }
    .cup-steam span:nth-child(2) { animation-delay: 0.4s; height: 45px; }
    .cup-steam span:nth-child(3) { animation-delay: 0.8s; height: 30px; }

    @keyframes steam {
      0% { transform: translateY(0) scaleX(1); opacity: 0; }
      15% { opacity: 0.7; }
      50% { transform: translateY(-20px) scaleX(1.8); opacity: 0.3; }
      100% { transform: translateY(-45px) scaleX(2.5); opacity: 0; }
    }

    /* ===== COFFEE BEANS FLOATING ===== */
    .bean {
      position: fixed;
      z-index: 0;
      font-size: 28px;
      opacity: 0;
      animation: floatBean linear infinite;
    }

    @keyframes floatBean {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    /* ===== TEXT CONTENT ===== */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 600px;
      padding: 0 20px;
    }

    .logo-img {
      width: 180px;
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
      animation: fadeIn 1.5s ease forwards;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: #d4a574;
      margin-bottom: 15px;
      animation: fadeIn 1.5s ease 0.3s both;
    }

    .subtitle {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #c8956c;
      margin-bottom: 30px;
      animation: fadeIn 1.5s ease 0.6s both;
      position: relative;
    }

    .subtitle::before,
    .subtitle::after {
      content: '✦';
      margin: 0 12px;
      font-size: 0.6rem;
      vertical-align: middle;
      color: #a07850;
    }

    .message {
      font-size: 1rem;
      line-height: 1.8;
      color: #bfa88e;
      margin-bottom: 40px;
      animation: fadeIn 1.5s ease 0.9s both;
    }

    /* ===== PROGRESS BAR ===== */
    .progress-section {
      animation: fadeIn 1.5s ease 1.2s both;
      margin-bottom: 35px;
    }

    .progress-label {
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8a7560;
      margin-bottom: 12px;
    }

    .progress-bar {
      width: 300px;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      margin: 0 auto;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b5e3c, #d4a574, #c8956c);
      border-radius: 3px;
      animation: fillProgress 3s ease 2s forwards;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite 3s;
    }

    @keyframes fillProgress {
      to { width: 65%; }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ===== SOCIAL LINKS ===== */
    .social {
      display: flex;
      gap: 20px;
      justify-content: center;
      animation: fadeIn 1.5s ease 1.5s both;
    }

    .social a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      color: #c8956c;
      text-decoration: none;
      transition: all 0.3s ease;
      border: 1px solid rgba(200,149,108,0.15);
    }

    .social a:hover {
      background: #c8956c;
      color: #1a110a;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(200,149,108,0.3);
    }

    .social svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ===== FOOTER ===== */
    .footer-text {
      position: fixed;
      bottom: 20px;
      font-size: 0.75rem;
      color: #5a4a3a;
      letter-spacing: 1px;
      z-index: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .title { font-size: 1.8rem; }
      .subtitle { font-size: 0.85rem; letter-spacing: 2px; }
      .cup-wrapper { transform: scale(0.8); }
      .progress-bar { width: 240px; }
    }
  </style>
</head>
<body>

  <script>
    // Generate floating steam particles
    const container = document.getElementById('steamContainer');
    for (let i = 0; i < 25; i++) {
      const particle = document.createElement('div');
      particle.className = 'steam';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.width = (Math.random() * 12 + 4) + 'px';
      particle.style.height = particle.style.width;
      particle.style.animationDuration = (Math.random() * 8 + 6) + 's';
      particle.style.animationDelay = (Math.random() * 10) + 's';
      container.appendChild(particle);
    }

    // Generate floating coffee beans (☕ emoji as beans)
    const beans = ['☕', '✦', '•'];
    for (let i = 0; i < 8; i++) {
      const bean = document.createElement('div');
      bean.className = 'bean';
      bean.textContent = beans[i % beans.length];
      bean.style.left = (10 + Math.random() * 80) + '%';
      bean.style.fontSize = (16 + Math.random() * 20) + 'px';
      bean.style.animationDuration = (12 + Math.random() * 10) + 's';
      bean.style.animationDelay = (Math.random() * 15) + 's';
      document.body.appendChild(bean);
    }
  </script>
